<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QA Agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('main.static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">QA Agent</a>
    <nav>
      <a href="{{ url_for('main.new_run') }}">New Run</a>
      <a href="{{ url_for('main.reports_list') }}">Reports</a>
      <a href="{{ url_for('main.healer_view') }}">Healer</a>
      <a href="{{ url_for('main.config_view') }}">Config</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-stack">
          {% for message in messages %}
            <div class="flash">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('main.static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
