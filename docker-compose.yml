services:
  postgres:
    image: postgres:16-alpine
    container_name: qa-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_agent_dev_password}
      POSTGRES_DB: qa_logs
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qa_agent_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-create-qa-config-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d qa_logs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qa_agent_pgdata:
